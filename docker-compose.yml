services:
  yumebot:
    image: ghcr.io/yumeyuka/yumebot:latest
    pull_policy: always
    container_name: yumebot
    restart: unless-stopped
    working_dir: /app
    env_file:
      - path: .env
        required: false
    environment:
      BOT_TOKEN: ${BOT_TOKEN:-}
      MINI_APP_URL: ${MINI_APP_URL:-}
      BILIBILI_ADMIN_ID: ${BILIBILI_ADMIN_ID:-}
      NETEASE_MUSIC_U: ${NETEASE_MUSIC_U:-}
      # 同时设置 ID 和 HASH 后，入口脚本会在本容器内启动 telegram-bot-api --local。
      # 不要拆成两个服务：发文件用 file:///app/data/...，两边必须是同一文件系统。
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_API_BASE_URL: ${TELEGRAM_API_BASE_URL:-}
    volumes:
      - ./data:/app/data
      # 可选：直接挂载配置文件（挂载后不再依赖 BOT_TOKEN 环境变量）
      # - ./config.conf:/app/config.conf:ro
