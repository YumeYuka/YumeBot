name: Linux Build and Publish

on:
  push:
    branches:
      - main
      - Moe
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - Moe
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: yumeyuka/yumebot
  LLVM_VERSION: 23

jobs:
  build-linux:
    name: Build Linux x64 Binary
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up CMake
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: '4.4.0'

      - name: Set up Clang
        uses: egor-tensin/setup-clang@v2
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libssl-dev libc++-${{ env.LLVM_VERSION }}-dev libc++abi-${{ env.LLVM_VERSION }}-dev

      - name: Build release binary
        run: |
          chmod +x ./scripts/build-release.sh
          ./scripts/build-release.sh yumebot-linux-x64

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: yumebot-linux-x64
          path: dist/
          if-no-files-found: error

  publish-docker:
    name: Build & Publish Docker Image
    needs: build-linux
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Linux Binary
        uses: actions/download-artifact@v4
        with:
          name: yumebot-linux-x64
          path: .

      - name: Prepare Binary
        run: |
          mv yumebot-linux-x64 yumebot
          chmod +x yumebot docker-entrypoint.sh
          test -d lib
          ls -l lib
          ldd yumebot

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || github.ref == 'refs/heads/Moe' }}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  create-release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-linux
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Linux binary
        uses: actions/download-artifact@v4
        with:
          name: yumebot-linux-x64
          path: release-assets

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
