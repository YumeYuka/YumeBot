name: Multi-Platform Build and Publish

on:
  push:
    branches:
      - main
      - Moe
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - Moe
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: yumeyuka/yumebot

jobs:
  build-matrix:
    name: Build Native Binary (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            artifact_name: yumebot-linux-x64
            install_deps: |
              sudo apt-get update
              sudo apt-get install -y ninja-build wget libssl-dev python3-pip
              python3 -m pip install "cmake>=4.3"
              wget -q https://apt.llvm.org/llvm.sh
              chmod +x llvm.sh
              sudo ./llvm.sh 21
              sudo apt-get install -y clang-21 lld-21

          - name: macos-arm64
            os: macos-latest
            artifact_name: yumebot-macos
            install_deps: |
              brew update
              brew install llvm@21 ninja openssl@3
              pip3 install "cmake>=4.3"
              echo "$(brew --prefix llvm@21)/bin" >> "$GITHUB_PATH"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: ${{ matrix.install_deps }}

      - name: Build release binary
        run: |
          chmod +x ./scripts/build-release.sh
          ./scripts/build-release.sh "${{ matrix.artifact_name }}"

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}
          if-no-files-found: error

  publish-docker:
    name: Build & Publish Docker Image (Linux x64)
    needs: build-matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Linux Binary
        uses: actions/download-artifact@v4
        with:
          name: yumebot-linux-x64
          path: .

      - name: Prepare Binary
        run: |
          mv yumebot-linux-x64 yumebot
          chmod +x yumebot docker-entrypoint.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || github.ref == 'refs/heads/Moe' }}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  create-release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-matrix
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
